<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador Odometría</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .canvas-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        canvas {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 5px;
            display: block;
        }
        .hud-monedas {
            position: absolute;
            top: 50px;
            right: 30px;
            background-color: white;
            color: black;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 30px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-weight: bolder;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #1177bb;
        }
    </style>
    <script src="animacion.js" defer></script>
    <script src="serial.js" defer></script>
</head>
<body>
    <div class="canvas-container">
        <canvas id="lienzo" width="850" height="850"></canvas>
        <div id="hudMonedas" class="hud-monedas">Monedas: 0</div>
    </div>
    <button id="conectar">Conectar Puerto Serie</button>
</body>
</html>
